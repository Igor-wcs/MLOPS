name: Datathon CI

on:
  push:
    branches: [ main, master, develop ]
    paths:
      - "src/**"
      - "tests/**"
      - "evaluation/**"
      - "dags/**"
      - "configs/**"
      - "pyproject.toml"
      - ".github/workflows/ci.yaml"
  pull_request:
    branches: [ main, master, develop ]
    paths:
      - "src/**"
      - "tests/**"
      - "evaluation/**"
      - "dags/**"
      - "configs/**"
      - "pyproject.toml"
      - ".github/workflows/ci.yaml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Continuous Integration
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "pyproject.toml"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          python -m spacy download en_core_web_sm

      - name: Run Black (format check)
        run: |
          black src/ tests/ evaluation/ dags/
          git diff --exit-code || (echo "Files were reformatted. Please commit changes." && exit 1)

      - name: Run Ruff (lint)
        run: ruff check src/ tests/ evaluation/ dags/

      - name: Run Mypy (type check)
        run: mypy src/ dags/

      - name: Run Bandit (security check)
        run: bandit -r src/ evaluation/ -ll

      - name: Create reports directory
        run: mkdir -p reports

      - name: Run Pytest
        run: |
          pytest tests/ -x \
            --cov=src \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-fail-under=80 \
            --junitxml=reports/test-results.xml

      - name: Upload coverage and test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-artifacts-${{ github.run_id }}
          path: |
            reports/test-results.xml
            coverage.xml
            .coverage
