# ==========================================
# 1. MONITORAMENTO DO MODELO PREDITIVO E DRIFT
# ==========================================
drift:
  warning_threshold: 0.1
  retrain_threshold: 0.2
  check_interval_minutes: 60
  reference_period: "1y"      # Período base para a API do yfinance extrair dados
  current_period: "1mo"       # Janela de análise em produção
  min_samples: 100

paths:
  report_html: "drift_report.html"
  report_json: "drift_report.json"

quality_gate:
  min_improvement_mae: 0.005
  ks_test_alpha: 0.05
  sigma_tolerance: 0.5

# ==========================================
#     MONITORAMENTO OPERACIONAL
# ==========================================
prometheus:
  port: 9090
  metrics_path: /metrics
  scrape_interval: 15s

alerting:
  slack_webhook: ""       # Configurar via .env em Produção
  email_to: ""
  rules:
    - name: "high_prediction_error"
      condition: "sigma_error > 0.5"
      severity: "critical"
    - name: "data_drift_detected"
      condition: "share_of_drifted_columns > 0.2"
      severity: "critical"
    - name: "model_latency_high"
      condition: "p99_latency_ms > 500"
      severity: "warning"

# ==========================================
#   QUALIDADE E SEGURANÇA DO AGENTE LLM
# ==========================================
llm_quality_gate:
  # RAGAS: Thresholds para as 4 métricas obrigatórias
  ragas_faithfulness: 0.8
  ragas_answer_relevancy: 0.8
  ragas_context_precision: 0.7
  ragas_context_recall: 0.7

security_guardrails:
  # OWASP Top 10 para LLMs: Parâmetros de mitigação
  max_input_tokens: 4096
  pii_detection_enabled: true
  block_prompt_injection: true
