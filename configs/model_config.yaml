# ==========================================
# DATATHON - CONFIGURAÇÃO CENTRAL
# ==========================================

# --- 1. Dados e Pipeline ---
data:
  ticker: "PETR4.SA"      # Ativo alvo para o baseline
  period: "5y"            # Histórico de coleta na API
  window_size: 30         # Janela de observação (dias passados)
  test_size: 0.2          # Split cronológico (80% Treino / 20% Teste)

# --- 2. Arquitetura do Modelo LSTM ---
model:
  input_size: 1           # 1 para univariado (Close). 
  hidden_size: 128
  num_layers: 2           
  output_size: 1
  dropout_rate: 0.2

# --- 3. Parâmetros de Treinamento ---
training:
  learning_rate: 0.001
  num_epochs: 30
  batch_size: 32

# --- 4. Métricas de Negócio  ---
business_metric:
  name: "sigma_tolerance"
  description: "Erro da previsão em desvios-padrão do preço observado"
  tolerance: 0.5          
  window_size: 30         

# --- 5. Agente e LLM (Qwen INT4) ---
llm:
  model_name: "Qwen/Qwen2.5-0.5B-Instruct"
  quantization: "int4"
  max_new_tokens: 512
  temperature: 0.1
  device_map: "auto"

# --- 6. Governança e Artefatos ---
paths:
  scaler_path: "scaler.pkl"
  experiment_name: "Datathon_Previsao_Acoes"
  registered_model_name: "LSTM_Petrobras"

# --- 7. RAG (Retrieval-Augmented Generation) ---
rag:
  embedding_model: "sentence-transformers/all-MiniLM-L6-v2" 
  vector_db_path: "data/chroma_db"
  docs_dir: "data/documents"
  chunk_size: 1000
  chunk_overlap: 200
  top_k: 3