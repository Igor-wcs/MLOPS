# Hiperparâmetros do modelo LSTM (Sincronizado com lstm_model.py)
lstm:
  input_size: 11          # No train.py features do FEATURE_COLS
  hidden_size: 128        # Definido no dict 'params' do train.py
  num_layers: 1           # O seu lstm_model.py usa o default do PyTorch (1 camada)
  output_size: 1          # Previsão do preço de fechamento
  batch_first: true
  dropout: 0.2            # Definido no dict 'params' do train.py

# Configuração de treinamento e dados (Sincronizado com train.py)
training:
  tickers: ["PETR4.SA"]   # O default da função train_and_log
  period: "5y"            # O tkt.history() está configurado para 5 anos
  seq_len: 30             # O train.py procura por 'seq_len', não 'window_size'
  window_size: 30         # Janela temporal para o preparar_janelas_temporais
  num_epochs: 30          # Definido no dict 'params'
  learning_rate: 0.001    # Definido no dict 'params'
  batch_size: 32          # Definido no dict 'params'
  test_size: 0.2          # O split cronológico é feito em 80/20 no código

# Métrica de negócio 
business_metric:
  name: "sigma_tolerance"
  description: "Erro da previsão em desvios-padrão do preço observado"
  tolerance: 0.5          
  window_size: 30         

# Configuração do Agente LLM
llm:
  model_name: "Qwen/Qwen2.5-0.5B-Instruct"
  quantization: "int4"
  max_new_tokens: 512
  temperature: 0.1
  device_map: "auto"