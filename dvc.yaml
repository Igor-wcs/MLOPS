stages:
  feature_engineering:
    cmd: python -m src.features.feature_engineering
    deps:
      - src/features/feature_engineering.py
      - configs/model_config.yaml
    params:
      - configs/model_config.yaml:
          - data.window_size
    outs:
      - data/processed

  train:
    cmd: python -m src.models.train
    deps:
      - data/processed
      - src/models/train.py
      - src/models/lstm_model.py
      - src/models/lstm_factory.py
      - src/models/lstm_params.py
      - configs/model_config.yaml
    params:
      - configs/model_config.yaml:
          - model
          - training
          - business_metric
    outs:
      - scaler.pkl:
          cache: false
          persist: true
      - model_weights.pt:
          cache: false
          persist: true

  evaluate:
    cmd: python -m evaluation.ragas_eval
    deps:
      - data/golden_set/golden_set.json
      - evaluation/ragas_eval.py
      - src/agent/react_agent.py
      - src/agent/rag_pipeline.py
      - src/agent/tools.py
      - configs/model_config.yaml
    outs:
      - ragas_detailed_report.csv:
          cache: false
