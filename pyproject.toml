[project]
name = "ml-llm-system-datathon-fase05"
version = "0.1.0"
description = "End-to-end ML + LLM system with observability, RAG, and governance"
authors = [{ name = "Igor Wasiljew" }]
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "fastapi==0.110.0",
    "uvicorn==0.29.0",
    "pydantic>=2.7.4",

    "torch==2.2.1",
    "numpy==1.26.4",
    "pandas==2.2.1",
    "scikit-learn==1.4.1.post1",
    "joblib==1.3.2",

    "seaborn",
    "matplotlib",

    "mlflow==2.11.3",
    "prometheus-fastapi-instrumentator==7.0.0",
    "evidently==0.4.18",

    "yfinance==0.2.40",

    "redis==5.0.3",
    "pyyaml==6.0.1",

    # --- Ecossistema IA Generativa e Avaliação ---
    "langchain>=0.3.0",
    "langchain-huggingface>=0.1.0",
    "langchain-openai>=0.1.3",
    "langchain-chroma>=0.1.0",      # Adicionado para o Banco Vetorial
    "ragas>=0.1.7",
    "datasets>=2.19.0",
    "transformers>=4.39.3",
    "sentence-transformers>=2.7.0", # Adicionado para os embeddings locais
    "accelerate>=0.28.0",
    "pypdf>=4.1.0",                 

    "trulens-eval>=0.26.0",
    "presidio-analyzer>=2.2.35",
    "presidio-anonymizer>=2.2.35",
    "spacy>=3.7.4"

]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "black>=24.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "bandit>=1.7"
    ]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"